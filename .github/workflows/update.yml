name: Update site

on:
  schedule:
    - cron: "7 */6 * * *"            # four times a day
    - cron: "*/20 15-23 * * 6"       # Saturdays from 11 AM to 7:40 PM Eastern during daylight time
    - cron: "*/20 0-6 * * 0"         # Saturday night games, through 2:40 AM Eastern Sunday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data and build the page
        run: |
          python fetch_data.py || echo "fetch reported errors; building with what it got"
          python build_site.py
      - name: Commit and push when anything changed
        run: |
          git config user.name "alma-mater-saturday"
          git config user.email "alma-mater-saturday@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
