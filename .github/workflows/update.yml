name: Update site

on:
  schedule:
    - cron: "7 12 * * *"             # once a day, 8:07 AM Eastern during daylight time
    - cron: "*/20 15-23 * * 6"       # Saturdays from 11 AM to 7:40 PM Eastern during daylight time
    - cron: "*/20 0-6 * * 0"         # Saturday night games, through 2:40 AM Eastern Sunday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch data and build the page
        run: |
          python fetch_data.py || echo "fetch reported errors; building with what it got"
          python build_site.py
      - name: Commit and push when anything changed
        run: |
          git config user.name "alma-mater-saturday"
          git config user.email "alma-mater-saturday@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
